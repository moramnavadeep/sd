# Telugu message catalog. Keys = the exact English templates in the code (saree_ai/**: T("...")).
# Saree terms used: పైట (pallu), కుచ్చిళ్లు (pleats), లంగా (petticoat), జాకెట్టు (blouse),
# బొడ్డు (navel), నడుము (waist), అంచు (hem), భుజం (shoulder).
# DRAFT: needs review by native Telugu speakers (planned in the data-collection pilot).
# tests/test_voice.py fails if any template in the code is missing here.
words:
  left: ఎడమ
  right: కుడి
messages:
  "(experimental model) {inner}": "(ప్రయోగాత్మక మోడల్) {inner}"
  "About {n} pleats - good.": "సుమారు {n} కుచ్చిళ్లు ఉన్నాయి - బాగుంది."
  "Bring the pallu up across your chest and over your left shoulder.": "పైటను ఛాతీ మీదుగా పైకి తెచ్చి ఎడమ భుజం మీద వేయండి."
  "Bring the pallu up across your chest to your left shoulder.": "పైటను ఛాతీ మీదుగా ఎడమ భుజం వైపు తీసుకురండి."
  "Confirmed by you.": "మీరు నిర్ధారించారు."
  "Face the camera and stand inside the frame. Better lighting may help.": "కెమెరా వైపు తిరిగి ఫ్రేమ్ లోపల నిలబడండి. వెలుతురు ఎక్కువగా ఉంటే బాగుంటుంది."
  "Hem looks level.": "అంచు సమానంగా ఉంది."
  "I can see about {n} pleats. Aim for {lo} to 7.": "నాకు సుమారు {n} కుచ్చిళ్లు కనిపిస్తున్నాయి. {lo} నుంచి 7 వరకు ఉండేలా చూడండి."
  "I can see about {n} pleats; they may be too narrow. Aim for 5 to 7 pleats about 5 inches wide.": "నాకు సుమారు {n} కుచ్చిళ్లు కనిపిస్తున్నాయి; అవి చాలా సన్నగా ఉండవచ్చు. సుమారు 5 అంగుళాల వెడల్పుతో 5 నుంచి 7 కుచ్చిళ్లు చేయండి."
  "I can't check pleat alignment reliably.": "కుచ్చిళ్లు సరళంగా ఉన్నాయో లేదో నేను నమ్మకంగా చెప్పలేను."
  "I can't check the hem reliably yet.": "అంచును నేను ఇంకా నమ్మకంగా చూడలేకపోతున్నాను."
  "I can't check the waist wrap reliably yet.": "నడుము చుట్టును నేను ఇంకా నమ్మకంగా చూడలేకపోతున్నాను."
  "I can't count the pleats clearly. Hold them spread out in front of you, or confirm manually.": "కుచ్చిళ్లను స్పష్టంగా లెక్కపెట్టలేకపోతున్నాను. వాటిని ముందు విప్పి పట్టుకోండి, లేదా మీరే నిర్ధారించండి."
  "I can't find the saree hem near your feet.": "మీ పాదాల దగ్గర చీర అంచు నాకు కనిపించడం లేదు."
  "I can't locate the pleats relative to your waist reliably.": "మీ నడుముకు సంబంధించి కుచ్చిళ్లు ఎక్కడ ఉన్నాయో నమ్మకంగా చెప్పలేను."
  "I can't measure pleat spacing reliably.": "కుచ్చిళ్ల మధ్య దూరాన్ని నమ్మకంగా కొలవలేను."
  "I can't see the pallu clearly enough to check it.": "పైట నాకు స్పష్టంగా కనిపించడం లేదు, అందుకే చెక్ చేయలేను."
  "I can't see the pallu length from the front. Turn sideways and check it reaches the back of your knees.": "ముందు నుంచి పైట పొడవు నాకు కనిపించదు. పక్కకు తిరిగి, అది మోకాళ్ల వెనుక వరకు ఉందో చూసుకోండి."
  "I can't see you well enough to check.": "చెక్ చేయడానికి మీరు నాకు సరిగ్గా కనిపించడం లేదు."
  "I can't see you. Step into the frame.": "మీరు కనిపించడం లేదు. ఫ్రేమ్ లోపలికి రండి."
  "I can't tell whether the pleats are tucked. Confirm manually when done.": "కుచ్చిళ్లు దోపారో లేదో నేను చెప్పలేను. అయ్యాక మీరే నిర్ధారించండి."
  "I haven't seen a camera frame yet.": "నాకు ఇంకా కెమెరా దృశ్యం అందలేదు."
  "I need to see both ankles to check the hem.": "అంచును చెక్ చేయడానికి రెండు చీలమండలూ కనిపించాలి."
  "I need to see both shoulders to check the pallu.": "పైటను చెక్ చేయడానికి రెండు భుజాలూ కనిపించాలి."
  "I'm not confident enough to judge this step from the camera.": "కెమెరా ద్వారా ఈ దశను అంచనా వేయగల నమ్మకం నాకు లేదు."
  "Move so your head is inside the frame.": "మీ తల ఫ్రేమ్ లోపల ఉండేలా జరగండి."
  "Okay, marked as done. Say next when you're ready.": "సరే, పూర్తైనట్లు గుర్తించాను. సిద్ధమైనప్పుడు \"తరువాత\" అని చెప్పండి."
  "Pallu is over your left shoulder.": "పైట మీ ఎడమ భుజం మీద ఉంది."
  "Part of you is outside the mirror view. Step back so your head and feet are on screen.": "మీలో కొంత భాగం అద్దం దృశ్యం బయట ఉంది. తల, పాదాలు తెరపై కనిపించేలా కొంచెం వెనక్కి జరగండి."
  "Pleat widths look even.": "కుచ్చిళ్ల వెడల్పు సమానంగా ఉంది."
  "Pleats are tucked in.": "కుచ్చిళ్లు దోపారు."
  "Pleats are well placed at the navel.": "కుచ్చిళ్లు బొడ్డు దగ్గర సరిగ్గా ఉన్నాయి."
  "Pleats hang straight.": "కుచ్చిళ్లు నిటారుగా వేలాడుతున్నాయి."
  "So far so good. Keep going.": "ఇప్పటివరకు బాగుంది. కొనసాగించండి."
  "Some pleats look wider than others. Try to make each fold the same width.": "కొన్ని కుచ్చిళ్లు మిగతావాటి కంటే వెడల్పుగా ఉన్నాయి. ప్రతి మడతనూ ఒకే వెడల్పుతో చేయండి."
  "Sorry, I didn't catch that.": "క్షమించండి, నాకు అర్థం కాలేదు."
  "Starting again.": "మళ్లీ మొదలుపెడుతున్నాను."
  "Step back a little so your feet are visible.": "మీ పాదాలు కనిపించేలా కొంచెం వెనక్కి జరగండి."
  "Step {n}. {title}.": "దశ {n}. {title}."
  "The hem looks higher on your {higher} side. Lower it so it just touches the floor all round.": "మీ {higher} వైపు అంచు ఎత్తుగా ఉంది. అన్ని వైపులా నేలను తాకేలా దించండి."
  "The pallu is on your right shoulder. In the Nivi style it goes over the LEFT shoulder.": "పైట మీ కుడి భుజం మీద ఉంది. నివి పద్ధతిలో అది ఎడమ భుజం మీద వేయాలి."
  "The pleats are slanting. Line up the top edges and let them fall straight down.": "కుచ్చిళ్లు వాలుగా ఉన్నాయి. పై అంచులను సమంగా చేసి, నిటారుగా కిందకు వేలాడనివ్వండి."
  "The pleats are too far to your {side}. Move them to just left of your navel.": "కుచ్చిళ్లు మీ {side} వైపు ఎక్కువగా ఉన్నాయి. వాటిని బొడ్డుకు కొంచెం ఎడమ వైపుకు జరపండి."
  "The pleats don't look tucked in yet. Push the top of the pleats into the petticoat at your navel.": "కుచ్చిళ్లు ఇంకా దోపినట్లు లేదు. కుచ్చిళ్ల పైభాగాన్ని బొడ్డు దగ్గర లంగాలోకి దోపండి."
  "The wrap doesn't seem to go all the way across your waist. Bring it fully round to the front.": "చుట్టు మీ నడుము మొత్తం చుట్టూ వెళ్లినట్లు లేదు. పూర్తిగా చుట్టి ముందుకు తీసుకురండి."
  "This step looks done. Say \"next\" when you're ready.": "ఈ దశ పూర్తైనట్లుంది. సిద్ధమైనప్పుడు \"తరువాత\" అని చెప్పండి."
  "Waist wrap looks complete from the front.": "ముందు నుంచి చూస్తే నడుము చుట్టు పూర్తైంది."
  "What I can see looks fine, but I couldn't check everything.": "నాకు కనిపించేది బాగానే ఉంది, కానీ అన్నీ చెక్ చేయలేకపోయాను."
  "Whole body visible.": "శరీరం మొత్తం కనిపిస్తోంది."
  "Yes, this step looks right to me.": "అవును, ఈ దశ సరిగ్గా ఉంది."
  "You can confirm this step manually.": "మీరు ఈ దశను స్వయంగా నిర్ధారించవచ్చు."
  "You can say: next step, previous step, repeat instruction, explain pleat formation, show pallu placement, start again, am I doing this correctly, or confirm.": "మీరు ఇలా చెప్పవచ్చు: తరువాత, వెనక్కి, మళ్లీ చెప్పు, కుచ్చిళ్లు ఎలా చేయాలి, పైట ఎలా వేయాలి, మళ్లీ మొదలు పెట్టు, నేను సరిగ్గా చేస్తున్నానా, లేదా బాగుంది."
