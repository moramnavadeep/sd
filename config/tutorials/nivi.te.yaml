# Telugu text for nivi.yaml (same step ids). Only text lives here; checks/guides come from nivi.yaml.
# DRAFT: needs review by native Telugu speakers. ఎడమ/కుడి = the user's own left/right.
steps:
  - id: setup
    title: సిద్ధం అవ్వండి
    instruction: జాకెట్టు వేసుకుని, లంగాను నడుము దగ్గర గట్టిగా కట్టుకోండి. మీ తల, పాదాలు రెండూ కనిపించేలా ఫ్రేమ్ లోపల నిలబడండి.
    speech: జాకెట్టు, లంగా వేసుకోండి. తర్వాత తల నుంచి పాదాల వరకు నాకు కనిపించేలా నిలబడండి.
  - id: tuck_start
    title: సాదా కొసను దోపండి
    instruction: చీరలో పైటకు ఎదురుగా ఉండే సాదా కొసను పట్టుకోండి. దాని పై అంచును బొడ్డుకు కొంచెం కుడి వైపున లంగాలోకి దోపండి. కింది అంచు నేలను తాకేలా ఉండాలి.
    speech: చీర సాదా కొసను బొడ్డుకు కొంచెం కుడి వైపున లంగాలోకి దోపండి.
  - id: wrap_waist
    title: నడుము చుట్టూ ఒకసారి చుట్టండి
    instruction: చీరను ముందు నుంచి మీ ఎడమ వైపుకు, వెనుక నుంచి తిప్పి, కుడి వైపు నుంచి మళ్లీ ముందుకు తీసుకురండి. చుట్టేటప్పుడు పై అంచును దోపుతూ ఉండండి, అంచు సమానంగా ఉండేలా చూడండి.
    speech: చీరను ముందు నుంచి ఎడమ వైపుకు, వెనుక నుంచి తిప్పి మళ్లీ ముందుకు చుట్టండి. అంచు నేలకు సమానంగా ఉండాలి.
  - id: form_pleats
    title: ముందు కుచ్చిళ్లు చేయండి
    instruction: ఒక్కొక్కటి సుమారు 5 అంగుళాలు (12 సెం.మీ.) వెడల్పుతో 5 నుంచి 7 కుచ్చిళ్లు చేయండి, అన్నీ ఎడమ వైపుకు మడవాలి. పై అంచులు కలిసి ఉండాలి, మడతలు నిటారుగా ఉండాలి.
    speech: ఇప్పుడు సుమారు ఐదు అంగుళాల వెడల్పుతో ఐదు నుంచి ఏడు సమానమైన కుచ్చిళ్లు చేయండి, ఎడమ వైపుకు మడవండి. నిటారుగా ఉంచండి.
  - id: tuck_pleats
    title: కుచ్చిళ్లను దోపండి
    instruction: కుచ్చిళ్లను కలిపి పట్టుకుని, బొడ్డు దగ్గర కొంచెం ఎడమ వైపున, మడతలు ఎడమ వైపుకు ఉండేలా లంగాలోకి దోపండి. కుచ్చిళ్లు నేల వరకు నిటారుగా పడుతున్నాయో చూడండి.
    speech: కుచ్చిళ్లను బొడ్డు దగ్గర, కొంచెం ఎడమ వైపున, మడతలు ఎడమ వైపుకు ఉండేలా లంగాలోకి దోపండి.
  - id: drape_pallu
    title: పైటను భుజం మీద వేయండి
    instruction: మిగిలిన చీరను మళ్లీ ఒకసారి వెనుక నుంచి చుట్టి, కుడి చేయి కింద నుంచి ముందుకు తెచ్చి, ఛాతీ మీదుగా వాలుగా ఎడమ భుజం మీద వేయండి.
    speech: మిగిలిన చీరను వెనుక నుంచి చుట్టి, కుడి చేయి కింద నుంచి తెచ్చి, ఛాతీ మీదుగా ఎడమ భుజం మీద వేయండి.
  - id: finish
    title: పైటను సరిచేసి పిన్ పెట్టండి
    instruction: పైట వెనుక మోకాళ్ల వరకు వేలాడేలా చూడండి. ఎడమ భుజం దగ్గర జాకెట్టుకు పిన్ పెట్టండి. పొడవు చూసుకోవడానికి పక్కకు తిరగండి.
    speech: పైట మోకాళ్ల వెనుక వరకు వేలాడేలా ఉంచి, ఎడమ భుజం దగ్గర పిన్ పెట్టండి.

explanations:
  pleats: >
    కుచ్చిళ్లు నడుము చుట్టుకు, పైటకు మధ్య ఉన్న బట్టతో చేస్తారు. పై అంచును పట్టుకుని, సుమారు 5 అంగుళాల
    బట్టను విసనకర్రలా ముందుకు వెనక్కి 5 నుంచి 7 సార్లు మడవండి, అన్నీ ఎడమ వైపుకు. పై అంచులు సమంగా
    ఉంటే మడతలు నిటారుగా పడతాయి. తర్వాత పై భాగాన్ని పట్టుకుని బొడ్డు దగ్గర దోపండి.
  pallu: >
    పైట అంటే చీరలో అలంకరణ ఉన్న కొస. కుచ్చిళ్లు దోపిన తర్వాత, మిగిలిన చీరను మళ్లీ వెనుక నుంచి చుట్టి,
    కుడి చేయి కింద నుంచి ముందుకు తెచ్చి, ఛాతీ మీదుగా వాలుగా వేయండి. అది ఎడమ భుజం మీద నుంచి
    మోకాళ్ల వెనుక వరకు వేలాడాలి.
  wrap: >
    ముందుగా సాదా కొసను బొడ్డుకు కొంచెం కుడి వైపున దోపండి. చీరను ముందు నుంచి ఎడమ వైపుకు, వెనుక నుంచి
    తిప్పి మళ్లీ ముందుకు తీసుకురండి. చుట్టూ పై అంచును దోపుతూ ఉండండి.
