# Model B - saree region segmentation. Trained by us; backbone optionally ImageNet-initialised.
task: segmentation
seed: 0
data:
  dirs: [data/synthetic_v1]          # add data/real_v1 etc. once consented data exists
  split: data/splits/default.json
  versions: []                       # fill with ids from training/data/dataset_version.py
model:
  arch: lraspp_mobilenet_v3          # 'full' profile; use tiny_unet (from scratch) for 'lite'
  imagenet_backbone: true
input_hw: [384, 256]
train: {epochs: 40, batch_size: 16, lr: 0.001, weight_decay: 0.0001, num_workers: 4, amp: true, device: auto}
# Status 'validated' requires meeting ALL of these on REAL held-out participants.
acceptance_targets: {miou_saree: 0.60, macro_f1: 0.70}
